
services:
  mysql:
    image: mysql:8.0
    container_name: tadreeb-mysql
    restart: always
    ports:
      - "3306:3306" 
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tadreeb_sis
      MYSQL_USER: tadreeb_user
      MYSQL_PASSWORD: userpassword
    volumes:
      - db_data:/var/lib/mysql

  php:
    image: php:8.2-apache
    container_name: tadreeb-php
    restart: always
    ports:
      - "8000:80"         
    volumes:
      - ./backend:/var/www/html   
    depends_on:
      - mysql

volumes:
  db_data:
