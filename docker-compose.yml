version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: tadreeb-mysql
    restart: always
    ports:
      - "3306:3306" 
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tadreeb_sis
      MYSQL_USER: tadreeb_user
      MYSQL_PASSWORD: userpassword
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: